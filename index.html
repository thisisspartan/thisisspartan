<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Llama.cpp Canonical Engine Monitor</title>
<style>
:root {
  --bg: #06090e;
  --panel: #0d131d;
  --border: #1a2436;
  --text: #f1f5f9;
  --dim: #64748b;
  --input: #38bdf8;
  --reuse: #22c55e;
  --warn: #eab308;
  --red: #ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;display:flex;flex-direction:column;overflow:hidden}

/* ВЕРХНЯЯ ПАНЕЛЬ */
#bar {
  height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

/* 1. БРЕНД СЛЕВА */
.bar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.brand-text-box {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.brand-title { font-size: 11px; font-weight: 800; color: var(--input); letter-spacing: 0.5px; }
.brand-sub { font-size: 9px; font-weight: 700; color: #f1f5f9; }
.brand-sub small { color: var(--dim); }

.gh-star-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #151e2b;
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 7px;
  border-radius: 5px;
  transition: all 0.2s ease;
}
.gh-star-btn:hover { border-color: var(--warn); color: #fff; }
.gh-star-btn svg { color: var(--warn); flex-shrink: 0; }
.gh-star-count { background: rgba(234,179,8,0.15); color: var(--warn); padding: 1px 4px; border-radius: 3px; font-size: 9.5px; }

/* РАЗДЕЛИТЕЛЬ */
.bar-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* 2. ТРИ ПЛАШКИ РЕЖИМА */
.mode-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #080d15;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 4px;
  flex-shrink: 0;
}
.m-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--dim);
  font: bold 10.5px inherit;
  border-radius: 4px;
  padding: 3px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s ease;
}
.m-btn:hover { color: var(--text); }

/* Активное состояние для 3 плашек */
.m-btn.on-live {
  background: rgba(34,197,94,0.12);
  border-color: rgba(34,197,94,0.5);
  color: var(--reuse);
  box-shadow: 0 0 10px rgba(34,197,94,0.2);
}
.m-btn.on-cloud {
  background: rgba(234,179,8,0.12);
  border-color: rgba(234,179,8,0.5);
  color: var(--warn);
  box-shadow: 0 0 10px rgba(234,179,8,0.2);
}
.m-btn.on-file {
  background: rgba(56,189,248,0.12);
  border-color: rgba(56,189,248,0.5);
  color: var(--input);
  box-shadow: 0 0 10px rgba(56,189,248,0.2);
}

.dot-pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--reuse);
  box-shadow: 0 0 6px var(--reuse);
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* 3. КНОПКИ ПЛЕЕРА */
.ctl-group {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.c-btn {
  background: #151e2b;
  border: 1px solid var(--border);
  color: var(--text);
  font: bold 11px inherit;
  border-radius: 5px;
  padding: 3px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}
.c-btn:hover { border-color: var(--input); color: var(--input); }
.c-btn-primary { color: var(--input); }
.c-btn-danger:hover { border-color: var(--red); color: var(--red); }
.c-select {
  background: #151e2b;
  border: 1px solid var(--border);
  color: var(--text);
  font: bold 11px inherit;
  border-radius: 5px;
  padding: 3px 6px;
  cursor: pointer;
}

/* 4. СТАТУС СПРАВА */
.bar-info {
  flex: 1;
  min-width: 0;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 11px;
}
#hint { color: var(--dim); }
#note { color: var(--warn); margin-left: 6px; font-weight: bold; }

#app { flex: 1; width: 100%; border: 0; min-height: 0; }
</style>
</head>
<body>

<div id="bar">
  <!-- ЛЕВО: Бренд + GitHub -->
  <div class="bar-brand">
    <div class="brand-text-box">
      <span class="brand-title">LLAMA.CPP INFERENCE</span>
      <span class="brand-sub">EDUCATIONAL MON <small>(ONE SLOT)</small></span>
    </div>
    <a href="https://github.com/thisisspartan/llama-log-observability" target="_blank" rel="noopener" class="gh-star-btn" title="Star on GitHub">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
      <span>GitHub</span>
      <span id="gh-stars" class="gh-star-count">★</span>
    </a>
  </div>

  <div class="bar-sep"></div>

  <!-- ЦЕНТР 1: ТРИ ЧЕТКИХ ПЛАШКИ РЕЖИМА -->
  <div class="mode-group">
    <button id="mDemo" class="m-btn on-live" title="Живая симуляция генерации">
      <span class="dot-pulse"></span> LIVE DEMO
    </button>
    <button id="mCloud" class="m-btn" title="Лог из репозитория llama-log-observability">
      ☁ ОБЛАЧНЫЙ ЛОГ
    </button>
    <button id="mLocal" class="m-btn" title="Загрузить свой файл с компьютера">
      📁 СВОЙ ФАЙЛ
    </button>
  </div>

  <div class="bar-sep"></div>

  <!-- ЦЕНТР 2: ПУЛЬТ УПРАВЛЕНИЯ -->
  <div class="ctl-group">
    <button id="btnPlay" class="c-btn c-btn-primary" title="Пауза / Старт">⏸</button>
    <button id="btnRestart" class="c-btn" title="Заново с начала">↺</button>
    <select id="selSpeed" class="c-select" title="Скорость воспроизведения">
      <option value="1">1x</option>
      <option value="3" selected>3x</option>
      <option value="10">10x</option>
      <option value="50">50x</option>
    </select>
    <label class="c-btn" style="cursor:pointer;" title="Выбрать .log файл">
      📂 <span>Файл</span>
      <input type="file" id="fInput" accept=".log,.txt" style="display:none">
    </label>
    <button id="btnClear" class="c-btn c-btn-danger" title="Очистить экран">🗑 <span>Очистить</span></button>
  </div>

  <!-- ПРАВО: СТАТУСНАЯ СТРОКА И ПРЕДУПРЕЖДЕНИЕ -->
  <div class="bar-info">
    <span id="hint">загрузка…</span>
    <span id="note"></span>
  </div>
</div>

<iframe id="app"></iframe>

<script>
'use strict';
const REMOTE_WWW = 'https://raw.githubusercontent.com/thisisspartan/llama-log-observability/main/www.js?v=' + Date.now();
const LOCAL_WWW = 'www.js?v=' + Date.now();
const CLOUD_LOG_URL = 'https://raw.githubusercontent.com/thisisspartan/llama-log-observability/main/demo.log?v=' + Date.now();

const MAX_GAP = 2500;
const $ = id => document.getElementById(id);
const realFetch = window.fetch.bind(window);
const tsOf = l => { const m = l && l.match(/^\[([^\]]+)\] /); const t = m ? Date.parse(m[1]) : NaN; return isNaN(t) ? null : t; };
const clean = l => l.replace(/^\[[^\]]+\] /, '');

let handler = null, liveCb = null, srv = null, DEMO = [], feedTok = 0;
let liveDemoPaused = false;
let currentSpeed = 3;

/* ---------- ЗАГЛУШКИ NODE.JS ДЛЯ WWW.JS ---------- */
const mkRes = (status, text) => ({ ok: status >= 200 && status < 300, status, text: async () => text, json: async () => JSON.parse(text) });
const nodeShim = {
  http: { createServer(h) { handler = h; return { listen(p, host, cb) { if (cb) cb(); }, on() {} }; } },
  readline: { createInterface() { return { on(ev, cb) { if (ev === 'line') liveCb = cb; } }; } },
  fs: { createWriteStream: () => ({ write() {}, on() {} }), stat: (f, cb) => cb(new Error('n/a')), readFileSync: () => '' },
  path: { join: (...a) => a.join('/') }
};
const nodeRequire = n => nodeShim[n];
const nodeProcess = { argv: ['node', 'www.js'], env: { HOME: '.' }, stdin: {}, stdout: { write() {} }, exit() {} };
const nodeBuffer = { byteLength: s => new TextEncoder().encode(s).length, alloc: n => new Uint8Array(n) };
const engFetch = (u) => {
  u = String(u);
  if (u.endsWith('/slots') && srv) {
    const s = srv.state;
    return Promise.resolve(mkRes(200, JSON.stringify([{ is_processing: s.is_processing, n_ctx: s.n_ctx || 0, n_prompt_tokens: s.n_prompt_tokens || 0 }])));
  }
  return Promise.resolve(mkRes(404, ''));
};

/* ---------- ВИРТУАЛЬНЫЙ РОУТЕР ДЛЯ IFRAME ---------- */
function call(url, opt) {
  return new Promise(resolve => {
    opt = opt || {};
    const method = (opt.method || 'GET').toUpperCase(), h = {};
    const req = { url, method, setEncoding() {}, on(e, f) { (h[e] = h[e] || []).push(f); return req; } };
    let status = 200; const chunks = [];
    const res = { writeHead(s) { status = s; }, write(c) { chunks.push(c); }, flushHeaders() {},
      end(c) { if (c != null) chunks.push(c); resolve(mkRes(status, chunks.join(''))); } };
    handler(req, res);
    if (method === 'POST') setTimeout(() => { (h.data || []).forEach(f => f(String(opt.body || ''))); (h.end || []).forEach(f => f()); }, 0);
  });
}
window.__SRV = {
  fetch(u, o) {
    o = o || {}; u = String(u);
    if (!u.startsWith('/')) return realFetch(u, o);
    return call(u, o);
  },
  sse(u, cb) {
    handler({ url: u, method: 'GET', on() {} },
      { writeHead() {}, flushHeaders() {}, end() {}, write(c) { c = String(c); if (c.startsWith('data: ')) cb(c.slice(6).trim()); } });
  }
};

/* СКРЫВАЕМ ДУБЛИРУЮЩИЙ ТУЛБАР ВНУТРИ IFRAME */
const IFRAME_SHIM = '<style>.ctl-bar{display:none !important;}</style>' +
  '<script>(function(){var P=parent.__SRV;window.fetch=function(u,o){return P.fetch(u,o)};' +
  'window.EventSource=function(u){var es=this;es.onopen=es.onmessage=es.onerror=null;' +
  'setTimeout(function(){P.sse(u,function(m){if(es.onmessage)es.onmessage({data:m})});if(es.onopen)es.onopen()},0)};})();<\/script>';

/* ---------- УПРАВЛЕНИЕ 3 РЕЖИМАМИ ---------- */
function setMode(mode, label, warningText) {
  $('mDemo').className = 'm-btn ' + (mode === 'demo' ? 'on-live' : '');
  $('mCloud').className = 'm-btn ' + (mode === 'cloud' ? 'on-cloud' : '');
  $('mLocal').className = 'm-btn ' + (mode === 'local' ? 'on-file' : '');
  $('hint').textContent = label;
  $('note').textContent = warningText || '';
}

// 1. РЕЖИМ: LIVE DEMO (ВСТРОЕННЫЙ ПОТОК)
function runLiveDemo() {
  const tok = ++feedTok;
  liveDemoPaused = false;
  $('btnPlay').textContent = '⏸';
  setMode('demo', 'Режим: LIVE DEMO (живая эмуляция)');
  srv.goLive();
  let i = 0;
  const lines = DEMO.length > 0 ? DEMO : sample();
  (function step() {
    if (tok !== feedTok || srv.state.mode !== 'LIVE') return;
    if (liveDemoPaused) { setTimeout(step, 200); return; }
    if (i >= lines.length) { setTimeout(() => { if (tok === feedTok && srv.state.mode === 'LIVE') runLiveDemo(); }, 3000); return; }
    const l = lines[i++]; liveCb(clean(l));
    const a = tsOf(l), b = tsOf(lines[i]);
    const delay = (a !== null && b !== null) ? Math.min(Math.max(0, b - a), MAX_GAP) : 200;
    setTimeout(step, delay / currentSpeed);
  })();
}

// 2. РЕЖИМ: ОБЛАЧНЫЙ ЛОГ (ИЗ РЕПОЗИТОРИЯ)
async function runCloudLog() {
  feedTok++;
  $('hint').textContent = 'Загрузка demo.log из GitHub…';
  $('note').textContent = '';

  try {
    const res = await realFetch(CLOUD_LOG_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const lines = text.split('\n').filter(Boolean);
    if (!lines.some(x => tsOf(x) !== null)) throw new Error('нет меток [ISO]');

    await call('/api/load-log', { method: 'POST', body: text });
    setMode('cloud', 'Облачный лог: demo.log из GitHub');
    $('btnPlay').textContent = '⏸';
  } catch (err) {
    // ЕСЛИ НЕТ — ПОКАЗЫВАЕМ ЖЕЛТЫЙ ПУТЬ И ЧТО ОТСУТСТВУЕТ!
    srv.playerFinish(true); srv.resetAll();
    setMode('cloud', 'Режим: ОБЛАЧНЫЙ ЛОГ', '⚠ ' + CLOUD_LOG_URL.split('?')[0] + ' не найден');
  }
}

// 3. РЕЖИМ: СВОЙ ЛОКАЛЬНЫЙ ФАЙЛ
function runLocalFile(customName) {
  feedTok++;
  liveDemoPaused = false;
  srv.playerFinish(true); srv.resetAll();
  srv.state.mode = 'PLAY'; srv.state.serverOnline = true; srv.updatePlayerState();
  setMode('local', customName ? 'Файл: ' + customName : 'Режим: СВОЙ ФАЙЛ (выберите .log через кнопку «Файл»)');
}

/* ---------- ОБРАБОТЧИКИ НАЖАТИЙ ---------- */
$('mDemo').onclick = runLiveDemo;
$('mCloud').onclick = runCloudLog;
$('mLocal').onclick = () => {
  runLocalFile();
  $('fInput').click(); // сразу открывает окно выбора файла на компе!
};

// ПАУЗА / СТАРТ
$('btnPlay').onclick = () => {
  if (srv.state.mode === 'LIVE') {
    liveDemoPaused = !liveDemoPaused;
    $('btnPlay').textContent = liveDemoPaused ? '▶' : '⏸';
  } else {
    const isPaused = srv.state.player && srv.state.player.paused;
    call('/api/player', { method: 'POST', body: JSON.stringify({ action: isPaused ? 'resume' : 'pause' }) });
    $('btnPlay').textContent = isPaused ? '⏸' : '▶';
  }
};

// ЗАНОВО
$('btnRestart').onclick = () => {
  if (srv.state.mode === 'LIVE') {
    runLiveDemo();
  } else {
    call('/api/player', { method: 'POST', body: JSON.stringify({ action: 'restart' }) });
  }
};

// СКОРОСТЬ
$('selSpeed').onchange = (e) => {
  currentSpeed = parseFloat(e.target.value) || 1;
  if (srv.state.mode !== 'LIVE') {
    call('/api/player', { method: 'POST', body: JSON.stringify({ action: 'speed', speed: currentSpeed }) });
  }
};

// ВЫБОР ФАЙЛА С КОМПЬЮТЕРА
$('fInput').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = (evt) => {
    const text = String(evt.target.result || '');
    call('/api/load-log', { method: 'POST', body: text }).then(res => {
      if (res.ok) {
        runLocalFile(f.name);
        $('btnPlay').textContent = '⏸';
      } else {
        alert('Ошибка формата. Нужен файл с логами llama-server вида [ISO] строка.');
      }
    });
  };
  r.readAsText(f);
  e.target.value = '';
};

// ОЧИСТИТЬ
$('btnClear').onclick = () => {
  call('/api/clear', { method: 'POST' });
};

/* СТРОКИ СИМУЛЯЦИИ */
function sample() {
  const o = []; let t = Date.parse('2026-10-03T10:00:00Z');
  const L = (s, d) => { t += d || 200; o.push('[' + new Date(t).toISOString() + '] ' + s); };
  L("srv load_model: initializing, n_slots = 1, n_ctx_slot = 124672, kv_unified = 'false'");
  let prev = 0;
  for (let k = 1; k <= 12; k++) {
    const id = k * 3, n = 8000 + k * 2000, re = k === 1 ? 0 : prev, d = n - re, p = 'slot update_slots: id 0 | task ' + id + ' | ';
    if (k === 1) L('slot get_availabl: id 0 | task -1 | selected slot by LRU, t_last = -1', 1000);
    else L('slot get_availabl: id 0 | task -1 | checking sim = 0.9' + (70 + k) + ' (' + re + '/' + n + ')', 1000);
    L('slot launch_slot_: id 0 | task ' + id + ' | new prompt, n_ctx_slot = 124672, n_keep = 0, task.n_tokens = ' + n);
    if (k % 3 === 0) L(p + 'restored context checkpoint (pos_min = 0, pos_max = ' + (re - 1) + ', n_tokens = ' + re + ', size = 210.5 MiB)');
    else L(p + 'cached n_tokens = ' + re + ', memory_seq_rm [0, end)');
    L(p + 'prompt processing progress, n_tokens = ' + (re + (d >> 1)) + ', batch.n_tokens = 2048, progress = 0.5');
    L(p + 'prompt processing done, n_tokens = ' + n, 800);
    L('slot print_timing: id 0 | task ' + id + ' | prompt eval time = ' + Math.round(d / 1.5) + '.0 ms / ' + d + ' tokens ( 0.7 ms per token, 1420.0 tokens per second)');
    L(p + 'n_gen = 120, tg = 58.' + k + ' t/s', 1000); L(p + 'n_gen = 280, tg = 60.' + k + ' t/s', 1500);
    L(p + 'created context checkpoint ' + Math.min(k, 16) + ' of 32 (pos_min = 0, pos_max = ' + (n + 279) + ', n_tokens = ' + (n + 280) + ', size = 215.2 MiB)');
    L('slot print_timing: id 0 | task ' + id + ' | eval time = 4600.0 ms / 280 tokens ( 16.4 ms per token, 60.' + k + ' tokens per second)', 200);
    L('slot print_timing: id 0 | task ' + id + ' | draft acceptance rate = 0.78 ( 218 accepted / 280 generated)');
    prev = n + 280;
  }
  return o;
}

/* ЗАПУСК */
(async function boot() {
  let src = '';
  try {
    const r = await realFetch(REMOTE_WWW, { cache: 'no-store' });
    if (!r.ok) throw 0;
    src = (await r.text()).replace(/^#!.*\n/, '');
  } catch (_) {
    try {
      const r2 = await realFetch(LOCAL_WWW, { cache: 'no-store' });
      if (!r2.ok) throw 0;
      src = (await r2.text()).replace(/^#!.*\n/, '');
    } catch (err) {
      $('hint').textContent = 'Ошибка загрузки www.js'; return;
    }
  }

  srv = new Function('require', 'process', 'Buffer', 'fetch',
    src + '\n;return {state,resetAll,goLive,playerFinish,updatePlayerState,HTML_PAGE};')(nodeRequire, nodeProcess, nodeBuffer, engFetch);

  DEMO = sample();
  $('app').srcdoc = srv.HTML_PAGE.replace('<head>', '<head>' + IFRAME_SHIM);

  // ПО УМОЛЧАНИЮ СРАЗУ ЗАПУСКАЕМ LIVE DEMO
  setTimeout(runLiveDemo, 250);
})();

// ЗВЕЗДЫ GITHUB
fetch('https://api.github.com/repos/thisisspartan/llama-log-observability')
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.stargazers_count !== undefined) $('gh-stars').textContent = d.stargazers_count; })
  .catch(() => {});
</script>
</body>
</html>
