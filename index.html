<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llama.cpp Interactive Log Player</title>
<style>
:root{
  --bg:#06090e;--panel:#0d131d;--panel2:#090e15;--border:#1a2436;--text:#f1f5f9;--dim:#64748b;
  --input:#38bdf8;--prefix:#6366f1;--slot:#94a3b8;--reuse:#22c55e;--kv-save:#14b8a6;--kv-evict:#475569;--prefill:#eab308;--decode:#a855f7;--mtp:#06b6d4;--mtp-dim:#22d3ee;--red:#ef4444;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.top-bar{flex-shrink:0}
.badge{padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:bold}.badge-on{background:#15803d;color:#fff}.badge-off{background:#b91c1c;color:#fff}.badge-warn{background:#dc2626;color:#fff;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}
.tag-pill{padding:2px 6px;border-radius:4px;font-weight:bold;font-size:10.5px}
.main-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; }
.left-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; height: 100%; }
.right-col { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 12px; position: relative; }
.card-history { flex: 1; min-height: 120px; display: flex; flex-direction: column; }
.card-log { flex: 1; min-height: 0; height: 100%; display: flex; flex-direction: column; }
.donut-layout{display:flex;align-items:center;gap:18px}.donut-box{position:relative;width:340px;height:340px;flex-shrink:0}.donut-box canvas{width:340px;height:340px;display:block}
.ring-tooltip{position:absolute;z-index:10;pointer-events:none;display:none;background:#0d1522;border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:11px;line-height:1.5;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.donut-core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; pointer-events: none; }
.phase-badge{font-size:12px;font-weight:bold;padding:3px 14px;border-radius:20px;background:#151e2b;color:var(--text);border:1px solid var(--border);margin-bottom:3px}
.live-speed{font-size:26px; font-weight:bold; color:#fff; margin:3px 0; white-space: nowrap;}
.live-pct{font-size:12px;color:var(--dim)}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:5px}.legend-row{display:flex;justify-content:space-between;align-items:center;background:#090e15;padding:5px 10px;border-radius:5px;border:1px solid var(--border)}.legend-title{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:bold}.dot{width:8px;height:8px;border-radius:2px}.legend-val{font-size:12.5px;font-weight:bold;color:#fff}
.log-box { flex: 1; height: 100%; min-height: 0; overflow-y: auto; background: #04070b; border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; }
.task-card { background: #090e16; border: 1px solid #1a2538; border-radius: 7px; margin-bottom: 8px; overflow: hidden; }
.task-card-header { display: flex; justify-content: space-between; align-items: center; background: #0d1522; padding: 6px 10px; font-size: 11.5px; }
.task-badge-id { background: #1a273b; color: var(--input); padding: 2px 7px; border-radius: 4px; font-size: 11px; }
.log-row { margin: 1px 0; padding: 4px 8px; border-radius: 4px; background: #070b12; border-left: 3px solid var(--border); display: flex; align-items: baseline; gap: 10px; font-size: 11.5px; }
.log-tag { width: 110px; min-width: 110px; flex-shrink: 0; text-align: center; font-size: 10px; padding: 2px 4px; border-radius: 4px; font-weight: bold; }
.log-msg { flex: 1; min-width: 0; word-break: break-word; }
.table-wrap{flex:1;height:100%;min-height:0;overflow-y:auto}.hist-table{width:100%;border-collapse:collapse;font-size:11px;font-family:monospace}.hist-table th,.hist-table td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--border)}.hist-table th{color:var(--dim);position:sticky;top:0;background:var(--panel)}

/* Плеер */
.player-bar { display:flex; align-items:center; gap:10px; background:#121a27; padding:6px 12px; border-radius:6px; border:1px solid var(--border); font-size:12px; }
.btn-play { background:var(--input); color:#000; border:none; padding:5px 12px; border-radius:4px; font-weight:bold; cursor:pointer; }
.btn-sec { background:transparent; border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px; }
.btn-sec:hover { border-color:var(--input); }
</style>
</head>
<body>
  <!-- Верхняя плашка управления эмуляцией -->
  <div class="top-bar" style="display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px 12px; margin-bottom:10px; gap:12px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <h1 style="margin:0; font-size:12px; font-weight:800; color:var(--input); letter-spacing:0.5px;">LLAMA.CPP REPLAY SIMULATOR</h1>
      <div class="player-bar">
        <button id="btn-toggle-play" class="btn-play">⏸ Пауза</button>
        <button id="btn-restart" class="btn-sec">↺ Заново</button>
        <label style="color:var(--dim);">Скорость:</label>
        <select id="sel-speed" style="background:#090e15; border:1px solid var(--border); color:#fff; border-radius:4px; padding:3px 6px;">
          <option value="1">1x (Реальная)</option>
          <option value="2">2x</option>
          <option value="5" selected>5x (Быстро)</option>
          <option value="20">20x (Ультра)</option>
        </select>
        <span id="play-progress" style="color:var(--dim); font-size:11px;">Строка 0 / 0</span>
      </div>
    </div>

    <div style="display:flex; gap:8px; align-items:center;">
      <label class="btn-sec" style="cursor:pointer; display:inline-block;">
        📂 Загрузить свой .log
        <input type="file" id="file-input" accept=".log,.txt" style="display:none;">
      </label>
      <div id="status-badge" class="badge badge-on">PLAYING DEMO</div>
    </div>
  </div>

  <div class="main-layout">
    <div class="left-col">
      <div class="card" style="padding:10px 12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:12px; font-weight:bold;">GPU VRAM KV-SLOT (<span id="hdr-ctx">123,136</span> CELLS)</span>
          <span style="font-size:11px; color:var(--dim);">Input: <b id="val-input" style="color:var(--input)">0</b> ток.</span>
        </div>
        <div class="donut-layout">
          <div class="donut-box">
            <canvas id="reactor-canvas" width="480" height="480"></canvas>
            <div class="donut-core" id="donut-core-bg">
              <div id="core-phase" class="phase-badge">IDLE</div>
              <div id="core-speed" class="live-speed">—</div>
              <div id="core-pct" class="live-pct">0 / 123k (0%)</div>
            </div>
          </div>
          <div class="donut-legend">
            <div class="legend-row">
              <div class="legend-title" style="color:var(--reuse)"><div class="dot" style="background:var(--reuse)"></div><span>KV REUSE:</span></div>
              <div class="legend-val" id="val-cached" style="color:var(--reuse)">0</div>
            </div>
            <div class="legend-row">
              <div class="legend-title" style="color:var(--prefill)"><div class="dot" style="background:var(--prefill)"></div><span>PREFILL:</span></div>
              <div class="legend-val" id="val-delta" style="color:var(--prefill)">0</div>
            </div>
            <div class="legend-row">
              <div class="legend-title" style="color:var(--decode)"><div class="dot" style="background:var(--decode)"></div><span>DECODE:</span></div>
              <div class="legend-val" id="val-gen" style="color:var(--decode)">0</div>
            </div>
            <div class="legend-row" style="background:transparent; border:none; padding:1px 0;">
              <div class="legend-title" style="color:var(--dim)"><span>CHECKPOINTS</span></div>
              <div class="legend-val" id="legend-cp" style="color:var(--kv-save);font-size:11px">—/—</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card card-history">
        <div style="font-size:11.5px; font-weight:bold; margin-bottom:4px;">REQUEST HISTORY</div>
        <div class="table-wrap">
          <table class="hist-table">
            <thead>
              <tr><th>TIME</th><th>TASK</th><th>INPUT</th><th>KV REUSE</th><th>PREFILL</th><th>DECODE</th><th>SPEED</th></tr>
            </thead>
            <tbody id="hist-rows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="card card-log">
        <div style="font-size:12px; font-weight:bold; margin-bottom:6px;">EVENT LOG (GPU & RAM TELEMETRY)</div>
        <div class="log-box" id="log-feed"></div>
      </div>
    </div>
  </div>

  <script>
  // ================= 1. ВСТРОЕННЫЙ ДЕМО-ЛОГ LLAMA.CPP =================
  const DEMO_LOG = `
[2026-10-02T20:00:00.000Z] srv load_model: initializing, n_slots = 1, n_ctx_slot = 123136, kv_unified = 'false'
[2026-10-02T20:00:01.000Z] selected slot by LRU id 0
[2026-10-02T20:00:01.100Z] new prompt, task.n_tokens = 45000, n_ctx_slot = 123136
[2026-10-02T20:00:01.200Z] forcing full prompt re-processing
[2026-10-02T20:00:02.000Z] prompt processing progress = 0.25, 420.5 tokens per second
[2026-10-02T20:00:03.000Z] prompt processing progress = 0.50, 422.0 tokens per second
[2026-10-02T20:00:04.000Z] prompt processing progress = 0.75, 419.0 tokens per second
[2026-10-02T20:00:05.000Z] prompt eval time = 4500.00 ms / 45000 tokens (421.20 tokens per second)
[2026-10-02T20:00:05.500Z] created context checkpoint 1 of 8 id 0 | n_tokens = 45000, size = 512.0 MiB
[2026-10-02T20:00:06.000Z] tg = 34.2 t/s, n_gen = 50
[2026-10-02T20:00:07.000Z] tg = 35.1 t/s, n_gen = 120
[2026-10-02T20:00:08.000Z] tg = 34.8 t/s, n_gen = 250
[2026-10-02T20:00:09.000Z] eval time = 3000.00 ms / 250 tokens (34.80 tokens per second)
[2026-10-02T20:00:11.000Z] checking sim = 0.95 (45000/47000) id 0
[2026-10-02T20:00:11.100Z] new prompt, task.n_tokens = 47000, n_ctx_slot = 123136
[2026-10-02T20:00:11.200Z] restored context checkpoint id 0 | n_tokens = 45000, size = 512.0 MiB
[2026-10-02T20:00:11.800Z] prompt eval time = 300.00 ms / 2000 tokens (410.00 tokens per second)
[2026-10-02T20:00:12.500Z] tg = 34.5 t/s, n_gen = 80
[2026-10-02T20:00:13.500Z] tg = 34.9 t/s, n_gen = 190
[2026-10-02T20:00:14.000Z] eval time = 2200.00 ms / 190 tokens (34.90 tokens per second)
`.trim().split('\n');

  // ================= 2. СОСТОЯНИЕ И ПАРСЕР ИЗ ВАШЕГО СКРИПТА =================
  function freshTaskState() {
    return {
      id: null, totalPrompt: 0, lcpTokens: 0, lcpRatio: 0, kvRestoredTokens: 0,
      deltaTokens: 0, prefillTokens: 0, prefillProgress: 0, prefillTps: 0,
      generatedTokens: 0, decodeTps: 0, decodeStarted: false, prefillReported: false,
      slotSource: null, checkpointRestore: false
    };
  }

  const state = {
    serverOnline: true, n_ctx: 123136, currentStage: 'IDLE',
    ramCache: { cpCreated: 0, cpErased: 0, cpCurrent: 0, cpMax: 8, slots: {} },
    task: freshTaskState(), history: [], events: []
  };

  let pendingLcp = null, pendingLru = null;

  function addEvent(stage, tag, title, detail, explicitTaskId = null) {
    state.currentStage = stage;
    const tid = explicitTaskId !== null ? String(explicitTaskId) : (state.task.id ? String(state.task.id) : 'SYS');
    state.events.unshift({ ts: new Date().toLocaleTimeString(), stage, tag, title, detail, taskId: tid });
    if (state.events.length > 300) state.events.pop();
    render();
  }

  function handleLine(line) {
    if (!line) return;
    if (line.includes('initializing,') && line.includes('n_ctx_slot =')) {
      const m = line.match(/n_ctx_slot\s*=\s*(\d+)/);
      if (m) state.n_ctx = parseInt(m[1], 10);
    }
    else if (line.includes('selected slot by LRU')) {
      pendingLcp = null; pendingLru = { slotId: '0' };
    }
    else if (line.includes('checking sim =')) {
      const m = line.match(/checking sim\s*=\s*([\d.]+)(?:\s*\((\d+)\/(\d+)\))?/);
      if (m) pendingLcp = { ratio: parseFloat(m[1]), tokens: parseInt(m[2]||0, 10), pct: (parseFloat(m[1])*100).toFixed(1) };
    }
    else if (line.includes('new prompt,')) {
      const m = line.match(/(?:task\s+(\d+).*?)?new prompt,.*?(?:task\.n_tokens|n_prompt_tokens)\s*=\s*(\d+)/);
      const tid = m ? (m[1] || '0') : '0';
      const promptTokens = m ? parseInt(m[2], 10) : 0;
      state.task = freshTaskState();
      state.task.id = tid;
      state.task.totalPrompt = promptTokens;
      addEvent('INPUT', 'INPUT', `Запрос #${tid}`, `Получено ${promptTokens} токенов`, tid);
      if (pendingLcp) {
        state.task.lcpTokens = pendingLcp.tokens;
        addEvent('PREFIX', 'PREFIX', 'LCP совпадение', `${pendingLcp.pct}% (${pendingLcp.tokens} ток.)`, tid);
        pendingLcp = null;
      }
    }
    else if (line.includes('restored context checkpoint')) {
      const mTokens = line.match(/n_tokens\s*=\s*(\d+)/);
      const tokens = mTokens ? parseInt(mTokens[1], 10) : 0;
      state.task.kvRestoredTokens = tokens;
      state.task.checkpointRestore = true;
      state.task.deltaTokens = Math.max(0, state.task.totalPrompt - tokens);
      addEvent('KV_RESTORE', 'KV REUSE RAM', 'Кэш поднят из RAM', `${tokens} ток. поднято из RAM в VRAM`);
    }
    else if (line.includes('forcing full prompt re-processing')) {
      state.task.kvRestoredTokens = 0;
      state.task.deltaTokens = state.task.totalPrompt;
      addEvent('KV_RESTORE', 'KV MISS', 'Cold Start', `Полный prefill с нуля`);
    }
    else if (line.includes('created context checkpoint')) {
      state.ramCache.cpCreated++;
      state.ramCache.cpCurrent++;
      addEvent('KV_RAM', 'KV SAVE RAM', 'Чекпоинт сохранен', `Контекст сохранен в Host RAM`);
    }
    else if (line.includes('prompt processing progress =')) {
      const m = line.match(/progress\s*=\s*([\d.]+)(?:.*?([\d.]+)\s*tokens per second)?/);
      if (m) {
        state.currentStage = 'PREFILL';
        state.task.prefillProgress = Math.round(parseFloat(m[1]) * 100);
        if (m[2]) state.task.prefillTps = parseFloat(m[2]);
        render();
      }
    }
    else if (line.includes('prompt eval time =')) {
      const m = line.match(/prompt eval time\s*=\s*([\d.]+)\s*ms\s*\/\s*(\d+)\s*tokens.*?([\d.]+)\s*tokens/);
      if (m) {
        state.task.prefillTokens = parseInt(m[2], 10);
        state.task.prefillTps = parseFloat(m[3]);
        addEvent('PREFILL', 'PREFILL', 'Префилл завершен', `${m[2]} ток. за ${m[1]} мс (${m[3]} t/s)`);
      }
    }
    else if (line.includes('tg =')) {
      const m = line.match(/n_gen\s*=\s*(\d+),\s*tg\s*=\s*([\d.]+)\s*t\/s/);
      if (m) {
        state.currentStage = 'DECODE';
        state.task.generatedTokens = parseInt(m[1], 10);
        state.task.decodeTps = parseFloat(m[2]);
        if (!state.task.decodeStarted) {
          state.task.decodeStarted = true;
          addEvent('DECODE', 'DECODE', 'Старт генерации', `Вывод начался (${m[2]} t/s)...`);
        }
        render();
      }
    }
    else if (line.includes('eval time =') && !line.includes('prompt eval')) {
      const m = line.match(/eval time\s*=\s*([\d.]+)\s*ms\s*\/\s*(\d+)\s*tokens.*?([\d.]+)\s*tokens/);
      if (m) {
        state.task.generatedTokens = parseInt(m[2], 10);
        state.task.decodeTps = parseFloat(m[3]);
        state.currentStage = 'DONE';
        addEvent('DONE', 'DONE', 'Ответ завершен', `Сгенерировано ${m[2]} ток. (${m[3]} t/s)`);
        state.history.unshift({
          id: state.task.id || '0', time: new Date().toLocaleTimeString(),
          input: state.task.totalPrompt, kvReuse: state.task.kvRestoredTokens,
          prefill: state.task.prefillTokens || state.task.deltaTokens,
          decode: state.task.generatedTokens, speed: state.task.decodeTps
        });
        render();
      }
    }
  }

  // ================= 3. ДВИЖОК ЭМУЛЯЦИИ И ВОСПРОИЗВЕДЕНИЯ =================
  let currentLogLines = [...DEMO_LOG];
  let lineIdx = 0;
  let isPlaying = true;
  let speedMultiplier = 5;
  let playTimer = null;

  function stepPlayback() {
    if (!isPlaying || lineIdx >= currentLogLines.length) return;
    const line = currentLogLines[lineIdx];
    handleLine(line);
    lineIdx++;
    document.getElementById('play-progress').innerText = `Строка ${lineIdx} / ${currentLogLines.length}`;

    if (lineIdx < currentLogLines.length) {
      playTimer = setTimeout(stepPlayback, 500 / speedMultiplier);
    } else {
      isPlaying = false;
      document.getElementById('btn-toggle-play').innerText = '▶ Заново';
    }
  }

  function startPlayback() {
    isPlaying = true;
    clearTimeout(playTimer);
    stepPlayback();
  }

  document.getElementById('btn-toggle-play').addEventListener('click', () => {
    if (lineIdx >= currentLogLines.length) {
      lineIdx = 0;
      startPlayback();
      document.getElementById('btn-toggle-play').innerText = '⏸ Пауза';
      return;
    }
    isPlaying = !isPlaying;
    document.getElementById('btn-toggle-play').innerText = isPlaying ? '⏸ Пауза' : '▶ Старт';
    if (isPlaying) stepPlayback();
  });

  document.getElementById('btn-restart').addEventListener('click', () => {
    lineIdx = 0;
    state.events = [];
    state.history = [];
    state.task = freshTaskState();
    startPlayback();
  });

  document.getElementById('sel-speed').addEventListener('change', (e) => {
    speedMultiplier = parseFloat(e.target.value);
  });

  // Загрузка своего .log файла пользователем
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      currentLogLines = evt.target.result.split('\n').filter(Boolean);
      lineIdx = 0;
      state.events = [];
      state.history = [];
      state.task = freshTaskState();
      document.getElementById('status-badge').innerText = 'PLAYING: ' + file.name;
      startPlayback();
    };
    reader.readAsText(file);
  });

  // ================= 4. ОТРИСОВКА ХОЛСТА И ДАННЫХ =================
  const cvs = document.getElementById('reactor-canvas');
  const ctx = cvs.getContext('2d');
  const CX = 240, CY = 240, R = 150, LW = 36;
  const START = -Math.PI / 2;

  function render() {
    const t = state.task;
    const tot = state.n_ctx || 123136;
    document.getElementById('hdr-ctx').innerText = tot.toLocaleString();

    // Отрисовка бублика
    ctx.clearRect(0, 0, 480, 480);
    ctx.lineWidth = LW;
    ctx.strokeStyle = '#151e2b';
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();

    const cachedAngle = (t.kvRestoredTokens / tot) * (Math.PI * 2);
    const deltaAngle = (t.deltaTokens / tot) * (Math.PI * 2);
    const genAngle = (t.generatedTokens / tot) * (Math.PI * 2);

    if (t.kvRestoredTokens > 0) {
      ctx.strokeStyle = '#22c55e'; ctx.beginPath();
      ctx.arc(CX, CY, R, START, START + cachedAngle); ctx.stroke();
    }
    if (t.deltaTokens > 0) {
      ctx.strokeStyle = '#eab308'; ctx.beginPath();
      ctx.arc(CX, CY, R, START + cachedAngle, START + cachedAngle + deltaAngle); ctx.stroke();
    }
    if (t.generatedTokens > 0) {
      ctx.strokeStyle = '#a855f7'; ctx.beginPath();
      ctx.arc(CX, CY, R, START + cachedAngle + deltaAngle, START + cachedAngle + deltaAngle + genAngle); ctx.stroke();
    }

    // Тексты в центре
    const totalUsed = t.kvRestoredTokens + t.deltaTokens + t.generatedTokens;
    document.getElementById('core-phase').innerText = state.currentStage;
    document.getElementById('core-speed').innerText = state.currentStage === 'DECODE' ? `${t.decodeTps.toFixed(1)} t/s` : (state.currentStage === 'PREFILL' ? `${t.prefillProgress}%` : '—');
    document.getElementById('core-pct').innerText = `${totalUsed.toLocaleString()} / ${(tot/1000).toFixed(0)}k (${((totalUsed/tot)*100).toFixed(1)}%)`;

    // Значения
    document.getElementById('val-input').innerText = t.totalPrompt.toLocaleString();
    document.getElementById('val-cached').innerText = t.kvRestoredTokens.toLocaleString();
    document.getElementById('val-delta').innerText = t.deltaTokens.toLocaleString();
    document.getElementById('val-gen').innerText = t.generatedTokens.toLocaleString();
    document.getElementById('legend-cp').innerText = `${state.ramCache.cpCurrent}/${state.ramCache.cpMax}`;

    // Таблица истории
    document.getElementById('hist-rows').innerHTML = state.history.map(h => `
      <tr>
        <td>${h.time}</td><td><b>#${h.id}</b></td>
        <td style="color:var(--input)">${h.input.toLocaleString()}</td>
        <td style="color:var(--reuse)">${h.kvReuse.toLocaleString()}</td>
        <td style="color:var(--prefill)">${h.prefill.toLocaleString()}</td>
        <td style="color:var(--decode)">${h.decode.toLocaleString()}</td>
        <td><b>${h.speed.toFixed(1)} t/s</b></td>
      </tr>
    `).join('');

    // Лента логов
    document.getElementById('log-feed').innerHTML = state.events.map(e => `
      <div class="log-row">
        <span class="tag-pill log-tag">${e.tag}</span>
        <span class="log-msg"><b>${e.title}:</b> ${e.detail}</span>
      </div>
    `).join('');
  }

  // Запуск при загрузке страницы
  startPlayback();
  </script>
</body>
</html>
