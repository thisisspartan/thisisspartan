<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Llama.cpp Canonical Engine Monitor — Replay</title>
<style>
html,body{margin:0;height:100%;background:#06090e;color:#f1f5f9;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace}
body{display:flex;flex-direction:column}
#bar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0d131d;border-bottom:1px solid #1a2436}
#bar b{color:#38bdf8;letter-spacing:.5px}
#bar button{background:#151e2b;border:1px solid #1a2436;color:#f1f5f9;font:bold 11px inherit;border-radius:5px;padding:4px 10px;cursor:pointer}
#bar button:hover{border-color:#38bdf8;color:#38bdf8}
#bar button.on{border-color:#38bdf8;color:#38bdf8;background:#122033}
#bar button#mLive.on{border-color:#22c55e;color:#22c55e;background:#0f2418}
#hint{color:#64748b;font-size:11px}
#note{color:#eab308;font-size:11px}
#app{flex:1;width:100%;border:0;min-height:0}
</style>
</head>
<body>
<div id="bar">
  <b>LLAMA.CPP INFERENCE · REPLAY</b>
  <button id="mLog">▤ ЛОГ</button>
  <button id="mLive">● LIVE</button>
  <span id="hint">загрузка…</span><span id="note"></span>
</div>
<iframe id="app"></iframe>
<script>
'use strict';
/* Автозагрузка напрямую из репозитория llama-log-observability:
   www.js   — исполняемый код монитора (тянется из main)
   demo.log — лог для демонстрации (если нет, сработает sample()) */
const WWW_URL = 'https://raw.githubusercontent.com/thisisspartan/llama-log-observability/main/www.js?v=' + Date.now();
const LOG_URL = 'https://raw.githubusercontent.com/thisisspartan/llama-log-observability/main/demo.log?v=' + Date.now();
const MAX_GAP = 2500;   // мс: максимальная пауза между строками в LIVE-демо
const $ = id => document.getElementById(id);
const realFetch = window.fetch.bind(window);
const tsOf = l => { const m = l && l.match(/^\[([^\]]+)\] /); const t = m ? Date.parse(m[1]) : NaN; return isNaN(t) ? null : t; };
const clean = l => l.replace(/^\[[^\]]+\] /, '');

let handler = null, liveCb = null, srv = null, DEMO = [], feedTok = 0;

/* ---------- заглушки Node-окружения для www.js ---------- */
const mkRes = (status, text) => ({ ok: status >= 200 && status < 300, status, text: async () => text, json: async () => JSON.parse(text) });
const nodeShim = {
  http: { createServer(h) { handler = h; return { listen(p, host, cb) { if (cb) cb(); }, on() {} }; } },
  readline: { createInterface() { return { on(ev, cb) { if (ev === 'line') liveCb = cb; } }; } },
  fs: { createWriteStream: () => ({ write() {}, on() {} }), stat: (f, cb) => cb(new Error('n/a')), readFileSync: () => '' },
  path: { join: (...a) => a.join('/') }
};
const nodeRequire = n => nodeShim[n];
const nodeProcess = { argv: ['node', 'www.js'], env: { HOME: '.' }, stdin: {}, stdout: { write() {} }, exit() {} };
const nodeBuffer = { byteLength: s => new TextEncoder().encode(s).length, alloc: n => new Uint8Array(n) };
// fetch внутри www.js: опрос /slots отвечает по состоянию самого движка, остальное — 404 (метрики не обязательны)
const engFetch = (u) => {
  u = String(u);
  if (u.endsWith('/slots') && srv) {
    const s = srv.state;
    return Promise.resolve(mkRes(200, JSON.stringify([{ is_processing: s.is_processing, n_ctx: s.n_ctx || 0, n_prompt_tokens: s.n_prompt_tokens || 0 }])));
  }
  return Promise.resolve(mkRes(404, ''));
};

/* ---------- «сервер» для iframe: маршрутизация в обработчик www.js ---------- */
function call(url, opt) {
  return new Promise(resolve => {
    const method = (opt.method || 'GET').toUpperCase(), h = {};
    const req = { url, method, setEncoding() {}, on(e, f) { (h[e] = h[e] || []).push(f); return req; } };
    let status = 200; const chunks = [];
    const res = { writeHead(s) { status = s; }, write(c) { chunks.push(c); }, flushHeaders() {},
      end(c) { if (c != null) chunks.push(c); resolve(mkRes(status, chunks.join(''))); } };
    handler(req, res);
    if (method === 'POST') setTimeout(() => { (h.data || []).forEach(f => f(String(opt.body || ''))); (h.end || []).forEach(f => f()); }, 0);
  });
}
window.__SRV = {
  fetch(u, o) {
    o = o || {}; u = String(u);
    if (!u.startsWith('/')) return realFetch(u, o);
    if (u === '/api/player' && o.method === 'POST') {
      let a = ''; try { a = JSON.parse(o.body || '{}').action; } catch (_) {}
      if (a === 'live') { startDemo(); return Promise.resolve(mkRes(200, '{"ok":true}')); } // «⏭ В LIVE» из интерфейса
    }
    return call(u, o);
  },
  sse(u, cb) {
    handler({ url: u, method: 'GET', on() {} },
      { writeHead() {}, flushHeaders() {}, end() {}, write(c) { c = String(c); if (c.startsWith('data: ')) cb(c.slice(6).trim()); } });
  }
};
const IFRAME_SHIM = '<script>(function(){var P=parent.__SRV;window.fetch=function(u,o){return P.fetch(u,o)};' +
  'window.EventSource=function(u){var es=this;es.onopen=es.onmessage=es.onerror=null;' +
  'setTimeout(function(){P.sse(u,function(m){if(es.onmessage)es.onmessage({data:m})});if(es.onopen)es.onopen()},0)};})();<\/script>';

/* ---------- режимы ---------- */
function enterLog() {            // ЛОГ (по умолчанию): ждёт прикрепления .log через «📂 Лог»
  feedTok++;
  srv.playerFinish(true); srv.resetAll();
  srv.state.mode = 'PLAY'; srv.state.serverOnline = true; srv.updatePlayerState();
}
function startDemo() {           // LIVE: зашитый лог идёт в stdin-заглушку как живой поток
  const tok = ++feedTok;
  srv.goLive();
  let i = 0;
  (function step() {
    if (tok !== feedTok || srv.state.mode !== 'LIVE') return;   // переключили режим или прикрепили лог
    if (i >= DEMO.length) { setTimeout(() => { if (tok === feedTok && srv.state.mode === 'LIVE') startDemo(); }, 4000); return; }
    const l = DEMO[i++]; liveCb(clean(l));
    const a = tsOf(l), b = tsOf(DEMO[i]);
    setTimeout(step, (a !== null && b !== null) ? Math.min(Math.max(0, b - a), MAX_GAP) : 0);
  })();
}
$('mLog').onclick = enterLog;
$('mLive').onclick = startDemo;
setInterval(() => {
  if (!srv) return;
  const live = srv.state.mode === 'LIVE';
  $('mLive').classList.toggle('on', live); $('mLog').classList.toggle('on', !live);
  $('hint').textContent = live ? 'LIVE: демо на зашитом логе (запись, не реальный сервер)'
    : srv.state.mode === 'PLAYBACK' ? 'ЛОГ: воспроизведение прикреплённого файла'
    : 'ЛОГ: нажмите «📂 Лог» внизу слева и выберите .log формата [ISO] строка';
}, 300);

/* ---------- встроенный пример на случай отсутствия demo.log ---------- */
function sample() {
  const o = []; let t = Date.parse('2026-10-03T10:00:00Z');
  const L = (s, d) => { t += d || 200; o.push('[' + new Date(t).toISOString() + '] ' + s); };
  L("srv load_model: initializing, n_slots = 1, n_ctx_slot = 124672, kv_unified = 'false'");
  let prev = 0;
  for (let k = 1; k <= 9; k++) {
    const id = k * 3, n = 6000 + k * 1500, re = k === 1 ? 0 : prev, d = n - re, p = 'slot update_slots: id 0 | task ' + id + ' | ';
    if (k === 1) L('slot get_availabl: id 0 | task -1 | selected slot by LRU, t_last = -1', 1500);
    else L('slot get_availabl: id 0 | task -1 | checking sim = 0.9' + (60 + k) + ' (' + re + '/' + n + ')', 1500);
    L('slot launch_slot_: id 0 | task ' + id + ' | new prompt, n_ctx_slot = 124672, n_keep = 0, task.n_tokens = ' + n);
    if (k % 4 === 3) L(p + 'restored context checkpoint (pos_min = 0, pos_max = ' + (re - 1) + ', n_tokens = ' + re + ', size = 149.626 MiB)');
    else L(p + 'cached n_tokens = ' + re + ', memory_seq_rm [0, end)');
    L(p + 'prompt processing progress, n_tokens = ' + (re + (d >> 1)) + ', batch.n_tokens = 2048, progress = 0.5');
    L(p + 'prompt processing done, n_tokens = ' + n, 900);
    L('slot print_timing: id 0 | task ' + id + ' | prompt eval time = ' + Math.round(d / 1.3) + '.0 ms / ' + d + ' tokens ( 0.8 ms per token, 1300.0 tokens per second)');
    L(p + 'n_gen = 80, tg = 61.' + k + ' t/s', 1200); L(p + 'n_gen = 190, tg = 62.' + k + ' t/s', 1800);
    L(p + 'created context checkpoint ' + Math.min(k, 8) + ' of 8 (pos_min = 0, pos_max = ' + (n + 249) + ', n_tokens = ' + (n + 250) + ', size = 149.626 MiB)');
    L('slot print_timing: id 0 | task ' + id + ' | eval time = 4100.0 ms / 250 tokens ( 16.4 ms per token, 61.' + k + ' tokens per second)', 300);
    L('slot print_timing: id 0 | task ' + id + ' | draft acceptance rate = 0.7' + k + ' ( 150 accepted / 210 generated)');
    prev = n + 250;
  }
  return o;
}

/* ---------- запуск ---------- */
(async function boot() {
  try {
    const r = await realFetch(WWW_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error(WWW_URL + ': HTTP ' + r.status);
    const src = (await r.text()).replace(/^#!.*\n/, '');
    // www.js исполняется как есть; в конец добавлен возврат внутренностей движка
    srv = new Function('require', 'process', 'Buffer', 'fetch',
      src + '\n;return {state,resetAll,goLive,playerFinish,updatePlayerState,HTML_PAGE};')(nodeRequire, nodeProcess, nodeBuffer, engFetch);
  } catch (e) {
    $('hint').textContent = 'Ошибка загрузки www.js: ' + e.message; console.error(e); return;
  }
  try {
    const r = await realFetch(LOG_URL, { cache: 'no-store' });
    if (!r.ok) throw 0;
    const l = (await r.text()).split('\n').filter(Boolean);
    if (!l.some(x => tsOf(x) !== null)) throw 0;
    DEMO = l;
  } catch (_) { DEMO = sample(); $('note').textContent = '⚠ ' + LOG_URL + ' не найден — встроенный пример'; }
  enterLog();   // режим по умолчанию — ЛОГ
  $('app').srcdoc = srv.HTML_PAGE.replace('<head>', '<head>' + IFRAME_SHIM);
})();
</script>
</body>
</html>
